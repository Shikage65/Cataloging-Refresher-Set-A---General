<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcard Reviewer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root {
  --paper: #F6F1E4;
  --paper-2: #EFE6CF;
  --ink: #26313A;
  --ink-soft: #5B6672;
  --brass: #A9822F;
  --stamp-red: #A5433A;
  --stamp-grn: #3E6B52;
  --rule: #D9CBA6;
  --shadow: 0 10px 30px rgba(38, 49, 58, 0.14);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper-2); color: var(--ink); font-family: 'Source Sans 3', system-ui, sans-serif; }
h1, h2, h3, .label { font-family: 'Roboto Slab', Georgia, serif; }
.mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 28px; background: var(--ink); color: var(--paper); }
.brand { font-family: 'Roboto Slab', serif; font-weight: 700; font-size: 1.15rem; letter-spacing: 0.02em; cursor: pointer; }
.topbar nav { display: flex; gap: 8px; }
.navlink { background: transparent; border: 1px solid rgba(246,241,228,0.35); color: var(--paper); padding: 8px 14px; border-radius: 4px; font-family: 'Source Sans 3', sans-serif; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
.navlink:hover { background: rgba(246,241,228,0.14); }
.wrap { max-width: 860px; margin: 0 auto; padding: 36px 20px 80px; }
.intro { text-align: center; margin-bottom: 32px; }
.intro h1 { font-size: 2rem; margin: 0 0 6px; }
.intro p { color: var(--ink-soft); margin: 0; }
.drawer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.drawer { background: linear-gradient(180deg, #DFCE9E, #CBB77E); border: 1px solid #B69D5E; border-radius: 6px; box-shadow: var(--shadow); padding: 0; cursor: pointer; overflow: hidden; text-align: left; font: inherit; color: inherit; }
.drawer:hover { transform: translateY(-3px); box-shadow: 0 16px 36px rgba(38,49,58,0.22); }
.drawer:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
.drawer-label { background: var(--paper); margin: 10px; border-radius: 3px; padding: 14px 14px 12px; border-top: 3px solid var(--brass); }
.drawer-label .subject-name { font-family: 'Roboto Slab', serif; font-weight: 700; font-size: 1.05rem; margin: 0 0 6px; }
.drawer-label .subject-meta { font-size: 0.8rem; color: var(--ink-soft); }
.drawer-pull { height: 22px; display: flex; align-items: center; justify-content: center; }
.drawer-pull::before { content: ""; width: 40px; height: 6px; border-radius: 3px; background: #7B5E22; }
.index-card { background: var(--paper); border-radius: 4px; box-shadow: var(--shadow); padding: 26px 30px 24px; position: relative; border: 1px solid var(--rule); }
.card-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.85rem; color: var(--ink-soft); padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.call-number { font-weight: 600; letter-spacing: 0.03em; }
.score-line { font-weight: 600; }
.progress-track { height: 5px; background: var(--rule); border-radius: 3px; margin: 18px 0 22px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--brass); }
.question-text { font-size: 1.2rem; line-height: 1.55; font-weight: 600; margin: 0 0 20px; }
.choice { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 13px 16px; margin: 9px 0; border: 1.5px solid var(--rule); border-radius: 5px; background: #FFFDF7; font-size: 1rem; font-family: inherit; color: var(--ink); cursor: pointer; }
.choice:hover:not(:disabled) { border-color: var(--brass); background: #FFF9E9; }
.choice .letter { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--brass); min-width: 1.2em; }
.choice:disabled { cursor: default; }
.choice.correct { background: #E7F0EA; border-color: var(--stamp-grn); }
.choice.correct .letter { color: var(--stamp-grn); }
.choice.wrong { background: #F5E6E3; border-color: var(--stamp-red); }
.choice.wrong .letter { color: var(--stamp-red); }
.feedback { margin-top: 16px; padding: 14px 16px; border-radius: 5px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.feedback.ok { background: #E7F0EA; color: var(--stamp-grn); }
.feedback.bad { background: #F5E6E3; color: var(--stamp-red); }
.stamp { font-family: 'Roboto Slab', serif; font-weight: 700; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; border: 2px solid currentColor; border-radius: 3px; padding: 3px 8px; transform: rotate(-4deg); }
.actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 24px; }
button.btn { border: 0; border-radius: 5px; padding: 12px 18px; font-weight: 600; font-size: 0.95rem; cursor: pointer; font-family: 'Source Sans 3', sans-serif; }
button.btn:active { transform: translateY(1px); }
button.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.15); }
.btn-secondary { background: var(--paper-2); color: var(--ink); border: 1px solid var(--rule); }
.btn-secondary:hover:not(:disabled) { background: var(--rule); }
.btn-danger { background: transparent; color: var(--stamp-red); border: 1px solid var(--stamp-red); }
.btn-danger:hover { background: var(--stamp-red); color: white; }
.results-card { text-align: center; background: var(--paper); border-radius: 6px; box-shadow: var(--shadow); padding: 40px 30px; border: 1px solid var(--rule); }
.results-card .subject-label { color: var(--ink-soft); font-weight: 600; margin-bottom: 4px; }
.big-score { font-family: 'IBM Plex Mono', monospace; font-size: 3.2rem; font-weight: 600; margin: 6px 0; }
.accuracy-pill { display: inline-block; padding: 6px 16px; border-radius: 20px; background: var(--paper-2); font-weight: 600; margin-bottom: 26px; }
.results-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.history-group { margin-bottom: 26px; }
.history-group h3 { margin: 0 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--brass); }
.take-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--paper); border: 1px solid var(--rule); border-radius: 5px; margin-bottom: 8px; cursor: pointer; }
.take-row:hover { border-color: var(--brass); }
.take-left { font-weight: 600; }
.take-date { color: var(--ink-soft); font-size: 0.82rem; margin-left: 10px; font-weight: 400; }
.take-score { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
.empty-state { text-align: center; color: var(--ink-soft); padding: 50px 20px; }
.detail-item { background: var(--paper); border: 1px solid var(--rule); border-left: 4px solid var(--rule); border-radius: 4px; padding: 14px 16px; margin-bottom: 10px; }
.detail-item.correct { border-left-color: var(--stamp-grn); }
.detail-item.wrong { border-left-color: var(--stamp-red); }
.detail-q { font-weight: 600; margin-bottom: 6px; }
.detail-meta { font-size: 0.88rem; color: var(--ink-soft); }
.detail-meta .ok-text { color: var(--stamp-grn); font-weight: 600; }
.detail-meta .bad-text { color: var(--stamp-red); font-weight: 600; }
.back-link { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 0.9rem; margin-bottom: 18px; padding: 0; font-family: inherit; }
.back-link:hover { color: var(--ink); }
.modal-backdrop { position: fixed; inset: 0; background: rgba(38,49,58,0.5); display: flex; align-items: center; justify-content: center; z-index: 50; }
.modal-box { background: var(--paper); border-radius: 6px; padding: 26px 28px; max-width: 340px; text-align: center; box-shadow: var(--shadow); }
.modal-box p { margin: 0 0 20px; font-weight: 600; }
.modal-actions { display: flex; gap: 10px; justify-content: center; }
@media (max-width: 520px) { .wrap { padding: 20px 14px 60px; } .index-card, .results-card { padding: 20px 18px; } .big-score { font-size: 2.4rem; } .actions { flex-wrap: wrap; } }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brandLink">Flashcard Reviewer</div>
    <nav>
      <button class="navlink" id="navSubjects">Subjects</button>
      <button class="navlink" id="navHistory">History</button>
    </nav>
  </header>
  <main id="app" class="wrap"></main>

or a particular type of library.", "choices": ["Guidebooks", "Standards", "Manuals", "Policies"], "correct_index": 1}, {"doc_number": 255, "question": "When a collection level is described as supporting only very general inquiries about a subject, characterized by a highly restricted collection of general materials and the absence of in-depth electronic resources or specialized periodicals, this corresponds to which \"Information Level\" using Conspectus?", "choices": ["Out of Scope 0.", "Minimal 1.", "Study 3.", "Basic 2."], "correct_index": 3}, {"doc_number": 256, "question": "A scholarly journal that provides analyses of trends in an academic field or summaries of the current state of research on topics of particular interest, with articles often submitted by invitation, is a:", "choices": ["Review journal.", "Primary journal.", "Synoptic journal.", "Abstract journal."], "correct_index": 0}, {"doc_number": 257, "question": "A university library's budget has been significantly reduced, prompting a review of all ongoing serial subscriptions for potential cancellation. This specific aspect of deselection is primarily driven by:", "choices": ["Low circulation of print issues.", "Changes in curriculum.", "Availability of online archives.", "Subscription price increases and budgetary constraints."], "correct_index": 3}, {"doc_number": 258, "question": "A bibliographic service that provides online access to the digital full-text of periodicals published by different publishers is known as an:", "choices": ["Publisher platform.", "Online catalog.", "Subscription agent.", "Aggregator service."], "correct_index": 3}, {"doc_number": 259, "question": "According to Gorman (1998), the acquisitions process is primarily concerned with what three specific operations related to library materials?", "choices": ["Budgeting, negotiation, and invoicing.", "Processing, shelving, and circulation.", "Selection, deselection, and evaluation.", "Ordering, claiming, and receipt."], "correct_index": 3}, {"doc_number": 260, "question": "True or False: \"Maps, globes, photographs, illustrations, and some kinds of games\" all fall under the \"graphic materials\" genre.", "choices": ["FALSE", "TRUE"], "correct_index": 1}, {"doc_number": 261, "question": "A newly acquired digital resource for a university library consists of text-filled and illustrated pages produced for electronic display and access. This material is broadly known as a/an:", "choices": ["Microform document.", "Physical monograph.", "Serial periodical.", "Electronic book (e-book)."], "correct_index": 3}, {"doc_number": 262, "question": "Historical collections in a library may contain a wide range of trading cards, pamphlets, postcards, and certificates. These are broadly categorized as:", "choices": ["Artifacts.", "Archives.", "Manuscripts.", "Ephemera."], "correct_index": 3}, {"doc_number": 263, "question": "A library develops a selection policy that aims to serve all groups of people in society equally, combining elements of both conservative and expansive approaches. This approach is consistent with:", "choices": ["The Traditional Viewpoint.", "The Liberal Viewpoint.", "The Modern Viewpoint.", "The Pluralist Viewpoint."], "correct_index": 3}, {"doc_number": 264, "question": "What are three-dimensional objects from real life, such as coins, textiles, natural items (rocks, shells), and other materials that do not fit into traditional categories, which libraries might collect?", "choices": ["Models.", "Ephemera.", "Kits.", "Realia."], "correct_index": 3}, {"doc_number": 265, "question": "What problem in collection management refers to the ongoing debate about whether libraries should prioritize purchasing physical items or providing access to digital resources?", "choices": ["Digital Preservation.", "Automation of the acquisition function.", "Access vs. ownership.", "Resource sharing."], "correct_index": 2}, {"doc_number": 266, "question": "A person who is actively looking for reasons to remove an item from a library collection and attempts to limit or block access to information, often infringing on the rights of others, is considered a what?", "choices": ["Librarian.", "Selector.", "Patron.", "Censor."], "correct_index": 3}, {"doc_number": 267, "question": "A librarian adheres to a philosophy that objects to purchasing popular best-selling fiction solely based on public demand and also opposes acquiring books deemed \"harmful.\" This aligns with which selection viewpoint?", "choices": ["The Modern Viewpoint.", "The Liberal Viewpoint.", "The Pluralist Viewpoint.", "The Traditional Viewpoint."], "correct_index": 3}, {"doc_number": 268, "question": "A librarian observes staff tying up fragile, brittle books with rubber bands. According to best practices, this action should be avoided because:", "choices": ["Rubber bands will cut into brittle pages and damage fragile covers.", "Rubber bands are not aesthetically pleasing.", "Rubber bands attract pests.", "Rubber bands are expensive."], "correct_index": 0}, {"doc_number": 269, "question": "In academic libraries, selection decisions for specific subject areas may be made by librarians or by whom else, based on their disciplinary expertise?", "choices": ["Library administrators without subject specialization.", "Members of the teaching faculty.", "Students.", "External consultants."], "correct_index": 1}, {"doc_number": 270, "question": "True or False: \"Begging\" (receiving gifts) and \"Bartering\" (exchanging materials) are considered valid methods of acquisition.", "choices": ["TRUE", "FALSE"], "correct_index": 0}]};
const QUESTIONS_PER_TAKE = 100;
const HISTORY_KEY = "flashcard_reviewer_history_v1";
const LETTERS = "ABCDEFGHIJ";
const app = document.getElementById("app");

document.getElementById("brandLink").addEventListener("click", () => Router.go("home"));
document.getElementById("navSubjects").addEventListener("click", () => Router.go("home"));
document.getElementById("navHistory").addEventListener("click", () => Router.go("history"));

function esc(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); }
  catch (e) { return []; }
}
function saveHistory(all) {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(all));
}
function addHistoryEntry(subject, score, total, items) {
  const all = loadHistory();
  const takeNumber = all.filter((r) => r.subject === subject).length + 1;
  const record = {
    id: Date.now() + Math.floor(Math.random() * 1000),
    subject, take_number: takeNumber, score, total,
    accuracy: total ? Math.round((score / total) * 1000) / 10 : 0,
    taken_at: new Date().toLocaleString(undefined, { dateStyle: "long", timeStyle: "short" }),
    items,
  };
  all.push(record);
  saveHistory(all);
  return record;
}

const State = { subject: null, questions: [], pos: 0, answers: {}, answeredCount: 0, score: 0 };

const Router = {
  go(view, param) {
    window.scrollTo(0, 0);
    if (view === "home") return Views.home();
    if (view === "quiz") return Views.startQuiz(param);
    if (view === "history") return Views.history();
    if (view === "historyDetail") return Views.historyDetail(param);
  },
};

const Views = {
  home() {
    const subjects = Object.keys(DATA).sort();
    const history = loadHistory();

    if (subjects.length === 0) {
      app.innerHTML = `<div class="intro"><h1>Flashcard Reviewer</h1></div>
        <p class="empty-state">No question banks were embedded in this file. Run
        <span class="mono">python build_html.py</span> again after adding .docx files to questions/.</p>`;
      return;
    }

    app.innerHTML = `
      <div class="intro">
        <h1>Flashcard Reviewer</h1>
        <p>Pick a drawer to start a randomized ${Math.min(QUESTIONS_PER_TAKE, DATA[subjects[0]].length)}-question take.</p>
      </div>
      <div class="drawer-grid" id="drawerGrid"></div>`;

    const grid = document.getElementById("drawerGrid");
    subjects.forEach((name) => {
      const pool = DATA[name];
      const completed = history.filter((r) => r.subject === name).length;
      const btn = document.createElement("button");
      btn.className = "drawer";
      btn.disabled = pool.length < 4;
      btn.innerHTML = `
        <div class="drawer-pull"></div>
        <div class="drawer-label">
          <div class="subject-name">${esc(name)}</div>
          <div class="subject-meta mono">${Math.min(QUESTIONS_PER_TAKE, pool.length)} questions per take &middot;
            ${pool.length} in bank &middot;
            ${completed} take${completed === 1 ? "" : "s"} completed</div>
        </div>`;
      btn.addEventListener("click", () => Router.go("quiz", name));
      grid.appendChild(btn);
    });
  },

  startQuiz(subject) {
    const pool = DATA[subject];
    const count = Math.min(QUESTIONS_PER_TAKE, pool.length);

    const shuffledPool = [...pool];
    for (let i = shuffledPool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffledPool[i], shuffledPool[j]] = [shuffledPool[j], shuffledPool[i]];
    }
    const chosen = shuffledPool.slice(0, count);

    State.subject = subject;
    State.questions = chosen.map((q, i) => {
      const order = q.choices.map((_, idx) => idx);
      for (let k = order.length - 1; k > 0; k--) {
        const j = Math.floor(Math.random() * (k + 1));
        [order[k], order[j]] = [order[j], order[k]];
      }
      return {
        id: i,
        doc_number: q.doc_number,
        question: q.question,
        choices: order.map((idx) => q.choices[idx]),
        correct_index: order.indexOf(q.correct_index),
      };
    });
    State.pos = 0;
    State.answers = {};
    State.answeredCount = 0;
    State.score = 0;

    Views.renderQuestion();
  },

  renderQuestion() {
    const q = State.questions[State.pos];
    const total = State.questions.length;
    const existing = State.answers[q.id];

    app.innerHTML = `
      <div class="index-card">
        <div class="card-top">
          <span class="call-number mono">${esc(State.subject.toUpperCase())}</span>
          <span class="mono">Question ${State.pos + 1}/${total}</span>
          <span class="score-line mono">Score: ${State.score}/${State.answeredCount}</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${(State.pos / total) * 100}%"></div></div>
        <div class="question-text">${esc(q.question)}</div>
        <div id="choices"></div>
        <div id="feedback"></div>
        <div class="actions">
          <button class="btn btn-secondary" id="backBtn" ${State.pos === 0 ? "disabled" : ""}>&larr; Back</button>
          <button class="btn btn-danger" id="abortBtn">Abort</button>
          <button class="btn btn-primary" id="nextBtn" disabled>${State.pos === total - 1 ? "Finish" : "Next →"}</button>
        </div>
      </div>`;

    document.getElementById("backBtn").addEventListener("click", Views.goBack);
    document.getElementById("abortBtn").addEventListener("click", Views.confirmAbort);
    document.getElementById("nextBtn").addEventListener("click", Views.goNext);

    const choicesEl = document.getElementById("choices");
    q.choices.forEach((choiceText, i) => {
      const btn = document.createElement("button");
      btn.className = "choice";
      btn.innerHTML = `<span class="letter">${LETTERS[i]}.</span><span>${esc(choiceText)}</span>`;
      btn.addEventListener("click", () => Views.answer(i));
      choicesEl.appendChild(btn);
    });

    if (existing) Views.lockChoices(existing.selectedIndex);
  },

  answer(selectedIndex) {
    const q = State.questions[State.pos];
    if (State.answers[q.id]) return;
    const isCorrect = selectedIndex === q.correct_index;
    State.answers[q.id] = { selectedIndex, isCorrect };
    State.answeredCount += 1;
    if (isCorrect) State.score += 1;
    document.querySelector(".score-line").textContent = `Score: ${State.score}/${State.answeredCount}`;
    Views.lockChoices(selectedIndex);
  },

  lockChoices(selectedIndex) {
    const q = State.questions[State.pos];
    const rec = State.answers[q.id];
    document.querySelectorAll(".choice").forEach((b, i) => {
      b.disabled = true;
      if (i === q.correct_index) b.classList.add("correct");
      if (i === selectedIndex && i !== q.correct_index) b.classList.add("wrong");
    });
    const fb = document.getElementById("feedback");
    fb.innerHTML = rec.isCorrect
      ? `<div class="feedback ok"><span class="stamp">Correct</span> Nicely done.</div>`
      : `<div class="feedback bad"><span class="stamp">Wrong</span> Correct answer: ${LETTERS[q.correct_index]}. ${esc(q.choices[q.correct_index])}</div>`;
    document.getElementById("nextBtn").disabled = false;
  },

  goBack() {
    if (State.pos === 0) return;
    State.pos -= 1;
    Views.renderQuestion();
  },

  goNext() {
    const q = State.questions[State.pos];
    if (!State.answers[q.id]) return;
    if (State.pos === State.questions.length - 1) Views.finish();
    else { State.pos += 1; Views.renderQuestion(); }
  },

  confirmAbort() {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal-box">
        <p>Are you sure you want to abort this take? It will not be saved.</p>
        <div class="modal-actions">
          <button class="btn btn-danger" id="abortYes">Yes, abort</button>
          <button class="btn btn-secondary" id="abortNo">No, continue</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    document.getElementById("abortYes").addEventListener("click", () => { backdrop.remove(); Router.go("home"); });
    document.getElementById("abortNo").addEventListener("click", () => backdrop.remove());
  },

  finish() {
    const items = State.questions.map((q) => {
      const rec = State.answers[q.id] || { selectedIndex: -1, isCorrect: false };
      return { question: q.question, choices: q.choices, selected_index: rec.selectedIndex, correct_index: q.correct_index, is_correct: rec.isCorrect };
    });
    const record = addHistoryEntry(State.subject, State.score, State.questions.length, items);
    Views.renderResults(record);
  },

  renderResults(saved) {
    app.innerHTML = `
      <div class="results-card">
        <div class="subject-label">${esc(saved.subject)} &middot; Take ${saved.take_number}</div>
        <h1>Quiz Complete</h1>
        <div class="big-score">${saved.score}/${saved.total}</div>
        <div class="accuracy-pill mono">Accuracy: ${saved.accuracy}%</div>
        <div class="results-actions">
          <button class="btn btn-primary" id="retakeBtn">Retake</button>
          <button class="btn btn-secondary" id="chooseBtn">Choose Another Subject</button>
          <button class="btn btn-secondary" id="historyBtn">History</button>
        </div>
      </div>`;
    document.getElementById("retakeBtn").addEventListener("click", () => Router.go("quiz", saved.subject));
    document.getElementById("chooseBtn").addEventListener("click", () => Router.go("home"));
    document.getElementById("historyBtn").addEventListener("click", () => Router.go("history"));
  },

  history() {
    const all = loadHistory();
    if (all.length === 0) {
      app.innerHTML = `<h1>History</h1><p class="empty-state">No completed takes yet. Finish a quiz to see it here.</p>`;
      return;
    }
    const grouped = {};
    all.forEach((r) => { (grouped[r.subject] = grouped[r.subject] || []).push(r); });
    Object.values(grouped).forEach((arr) => arr.sort((a, b) => a.take_number - b.take_number));

    app.innerHTML = `<h1>History</h1>` + Object.keys(grouped).sort().map((subj) => `
      <div class="history-group">
        <h3>${esc(subj)}</h3>
        ${grouped[subj].map((t) => `
          <div class="take-row" data-id="${t.id}">
            <div class="take-left">Take ${t.take_number}<span class="take-date">${esc(t.taken_at)}</span></div>
            <div class="take-score">${t.score}/${t.total} &middot; ${t.accuracy}%</div>
          </div>`).join("")}
      </div>`).join("");

    document.querySelectorAll(".take-row").forEach((row) => {
      row.addEventListener("click", () => Router.go("historyDetail", Number(row.dataset.id)));
    });
  },

  historyDetail(takeId) {
    const all = loadHistory();
    const t = all.find((r) => r.id === takeId);
    if (!t) { app.innerHTML = `<p class="empty-state">That take could not be found.</p>`; return; }

    app.innerHTML = `
      <button class="back-link" id="backToHistory">&larr; Back to History</button>
      <div class="results-card" style="margin-bottom:24px;">
        <div class="subject-label">${esc(t.subject)} &middot; Take ${t.take_number}</div>
        <div class="big-score">${t.score}/${t.total}</div>
        <div class="accuracy-pill mono">Accuracy: ${t.accuracy}% &middot; ${esc(t.taken_at)}</div>
      </div>
      <h3>Question Breakdown</h3>
      ${t.items.map((item, i) => {
        const cls = item.is_correct ? "correct" : "wrong";
        const yourText = item.selected_index >= 0 ? `${LETTERS[item.selected_index]}. ${esc(item.choices[item.selected_index])}` : "No answer";
        const correctText = `${LETTERS[item.correct_index]}. ${esc(item.choices[item.correct_index])}`;
        return `
        <div class="detail-item ${cls}">
          <div class="detail-q">Q${i + 1}. ${esc(item.question)}</div>
          <div class="detail-meta">
            Your answer: <span class="${item.is_correct ? "ok-text" : "bad-text"}">${yourText}</span>
            ${item.is_correct ? "" : `<br>Correct answer: <span class="ok-text">${correctText}</span>`}
          </div>
        </div>`;
      }).join("")}`;

    document.getElementById("backToHistory").addEventListener("click", () => Router.go("history"));
  },
};

Router.go("home");
</script>
</body>
</html>

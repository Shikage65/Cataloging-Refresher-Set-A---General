<!doctype html>
<html><head><meta charset="utf-8"><title>Cataloging Refresher Set A</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;color:#1f2937}
.wrap{max-width:900px;margin:30px auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 5px 25px #0002}
.top{display:flex;justify-content:space-between;font-weight:bold;font-size:18px}
.bar{height:8px;background:#ddd;border-radius:8px;margin:18px 0 25px}
.fill{height:100%;background:#2563eb}

.choice.correct{background:#dcfce7;border-color:#16a34a}
.choice.wrong{background:#fee2e2;border-color:#dc2626}
.choice:disabled{cursor:default}
.feedback{padding:13px;margin-top:14px;border-radius:10px;font-weight:bold}
.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}
.actions{display:flex;justify-content:space-between;margin-top:20px;gap:8px}
button{border:0;border-radius:10px;padding:12px 17px;font-weight:bold;cursor:pointer}
.next{background:#2563eb;color:#fff}.back{background:#6b7280;color:#fff}.abort{background:#dc2626;color:#fff}
.hidden{display:none}.score{font-size:42px;font-weight:800}.wrongq{padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0}
</style></head>

let order=[],pos=0,score=0,answers={},wrong=[],answered=false;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=shuffle(Q);pos=0;score=0;answers={};wrong=[];answered=false;show()}
function show(){
 let q=order[pos];
 app.innerHTML=`<div class="top"><span>Question ${pos+1} of ${order.length}</span><span>Score: ${score}</span></div>
 <div class="bar"><div class="fill" style="width:${pos/order.length*100}%"></div></div>
 <div class="question">${q.html_question}</div><div id="choices"></div><div id="fb"></div>
 <div class="actions"><button class="back" onclick="back()">← Back</button>
 <button class="abort" onclick="abortQuiz()">Abort Quiz</button>
 <button id="next" class="next hidden" onclick="next()">${pos===order.length-1?"Finish":"Next →"}</button></div>`;
 q.choices.forEach((c,i)=>{
  let b=document.createElement("button");b.className="choice";b.innerHTML="<b>"+'ABCD'[i]+".</b> "+esc(c);
  b.onclick=()=>answer('ABCD'[i],b);document.getElementById("choices").appendChild(b);
 });
 if(answers[q.number]) restore(q);
}
function answer(letter,clicked){
 if(answered)return; answered=true;
 let q=order[pos]; answers[q.number]=letter;
 document.querySelectorAll(".choice").forEach((b,i)=>{b.disabled=true;if('ABCD'[i]===q.answer)b.classList.add("correct")});
 let fb=document.getElementById("fb");
 if(letter===q.answer){score++;clicked.classList.add("correct");fb.className="feedback ok";fb.textContent="✓ Correct!"}
 else{clicked.classList.add("wrong");let a='ABCD'.indexOf(q.answer);fb.className="feedback bad";fb.textContent="✗ Wrong! Correct answer: "+q.answer+". "+q.choices[a];wrong.push({number:q.number,question:q.question,your:letter,correct:q.answer,correctText:q.choices[a]})}
 document.querySelector(".top span:last-child").textContent="Score: "+score;
 document.getElementById("next").classList.remove("hidden");
}
function restore(q){answered=true;let letter=answers[q.number];document.querySelectorAll(".choice").forEach((b,i)=>{b.disabled=true;if('ABCD'[i]===q.answer)b.classList.add("correct");if('ABCD'[i]===letter&&letter!==q.answer)b.classList.add("wrong")});let fb=document.getElementById("fb");if(letter===q.answer){fb.className="feedback ok";fb.textContent="✓ Correct!"}else{let a='ABCD'.indexOf(q.answer);fb.className="feedback bad";fb.textContent="✗ Wrong! Correct answer: "+q.answer+". "+q.choices[a]}document.getElementById("next").classList.remove("hidden")}
function back(){if(pos>0){pos--;answered=!!answers[order[pos].number];show()}}
function next(){if(!answered)return;if(pos===order.length-1)finish();else{pos++;answered=!!answers[order[pos].number];show()}}
function abortQuiz(){if(confirm("Abort this take? It will not be recorded."))menu()}
function finish(){let h=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");h.push({take:h.length+1,score:score,total:Q.length,wrong:wrong});localStorage.setItem(HISTORY_KEY,JSON.stringify(h));result(h[h.length-1])}
function result(r){app.innerHTML=`<h1>Take Complete!</h1><div class="score">${r.score}/${r.total}</div><h2>Questions You Got Wrong</h2>${r.wrong.length?r.wrong.map(x=>`<div class="wrongq"><b>#${x.number}</b> ${esc(x.question)}<br>Your answer: ${x.your}<br>Correct: ${x.correct}. ${esc(x.correctText)}</div>`).join(""):"🎉 Perfect score!"}<br><br><button class="next" onclick="start()">Retake</button><button class="back" onclick="menu()">Back to Menu</button>`}
function menu(){app.innerHTML="<h1>📚 Cataloging Refresher Set A</h1><p>100-question flashcard quiz</p><button class='next' onclick='start()'>Start Quiz</button>"}
menu();
</script></body></html>
